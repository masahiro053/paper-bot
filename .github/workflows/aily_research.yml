name: Daily arXiv Research Bot

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 💡 ボットがGitHubにファイルを書き込めるように権限（permissions）を与える
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Python Script
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          
      # 💡 実行後に history.txt をGitHubにコミットして保存する
      - name: Commit and Push history
        run: |
          # ボットとしての名前とメールアドレスを設定
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # history.txtをステージング
          git add history.txt
          
          # ファイルに変更があればコミットしてプッシュする（[skip ci] で無限ループを防ぐ）
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update history.txt [skip ci]" && git push)